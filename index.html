<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spencer's Dogwalkery — Professional Dog Walking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b2545;
      --gold: #d4a547;
      --muted: #f5f7fb;
      --text: #1b2b3a;
      --card-shadow: 0 6px 18px rgba(8, 20, 40, 0.08);
      --max-width: 1200px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Lato, sans-serif; color: var(--text); background: white; }
    header, footer { background: white; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; }
    .cta-btn { background: var(--gold); color: white; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>
  <header class="container">
    <h1 style="font-family:'Playfair Display',serif;color:var(--navy);">Spencer's Dogwalkery</h1>
  </header>

  <main class="container">
    <h2>Welcome to Spencer's Dogwalkery</h2>
    <p>Reliable, professional dog walking and pet care services in your neighborhood. Explore our services, meet Spencer, and book a walk today!</p>
    <a href="calendar.html" class="cta-btn">View Availability</a>
  </main>

  <footer class="container" style="margin-top:40px;padding:20px 0;border-top:1px solid #e5e9ef;text-align:center;color:#667;">
    © 2025 Spencer's Dogwalkery
  </footer>
</body>
</html>
